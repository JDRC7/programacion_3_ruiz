<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD de Productos</title>
    <script src="dom12_crud_productos.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            margin-right: 5px;
        }

        .cancelar {
            background-color: #6c757d;
            color: white;
            border: none;
        }

        .editar {
            background-color: #ffc107;
            border: none;
        }

        .eliminar {
            background-color: #dc3545;
            color: white;
            border: none;
        }

        .agregar {
            background-color: #198754;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Eventos del DOM</h1>
    <h2>CRUD de Productos</h2>

    <div>
        <h3>Agregar / Editar Producto</h3>

        <form id="formulario">

            <label for="nombre">Nombre:</label>
            <input
                id="nombre"
                type="text"
                placeholder="Ingrese el nombre"
                required
            >

            <br><br>

            <label for="descripcion">Descripción:</label>
            <input
                id="descripcion"
                type="text"
                placeholder="Ingrese la descripción"
                required
            >

            <br><br>

            <label for="precio">Precio:</label>
            <input
                id="precio"
                type="number"
                step="0.01"
                placeholder="Ingrese el precio"
                required
            >

            <br><br>

            <button type="button" id="agregarBtn" class="agregar">
                Agregar Producto
            </button>

            <button type="button" id="cancelar" class="cancelar">
                Cancelar
            </button>

        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="cuerpoTabla">

        </tbody>
    </table>

</body>
</html>
