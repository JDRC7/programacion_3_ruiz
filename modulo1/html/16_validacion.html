<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Validacion</title>
</head>
<body>
    <h1>Formulario con Validacion</h1>

    <form action="/procesar" method="post">
       <fieldset>
        <legend>Campo Obligatorio</legend>
        <label for="nombre">Nombre</label><br>
        <input type="text" id="nombre" name="nombre" required>
        
       </fieldset>
       <fieldset>
        <legend> Minlength /Maxlength</legend>
        <label for="apellid">Apellido</label>
        <input type="text" id="apellido" name="Apellido" min="18" max="99">
       </fieldset>
       <fieldset>
        <legend> Patron de caracteres - exprecion regular</legend>
        <label for="codigo_postal">Codigo Postal</label>
        <input type="email" id="codigo_postal" name="codigo_postal" pattern="[0-9]{5}">
       </fieldset>
       <fieldset>
        <legend>MIN MAX rango para nunmeros</legend>
        <label for="edad">edad</label>
        <input type="number" id="edad" name="edad" min="18" max="99">
       </fieldset>
       <legend>Deshabilitado</legend>
        <label for="ref">Referencia</label>
        <input type="text" id="ref" name="ref" value="REF-001" disabled>
       </fieldset>
       <legend>Solo lectura</legend>
        <label for="pais">Pais</label>
        <input type="text" id="pais" name="pais" value="Ecuador" readonly>
       </fieldset>
       <button type="submit">Crear Cuenta</button>
    

    </form>
</body>
</html>
